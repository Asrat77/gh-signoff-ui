<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'">
  <title>Signoff</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <div class="palette-overlay" id="paletteOverlay" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Quick actions">
      <label class="sr-only" for="paletteInput">Search actions and pull requests</label>
      <input id="paletteInput" autocomplete="off" placeholder="Open a PR, run a check, or change a setting…">
      <div id="paletteResults" class="palette-results" role="listbox"></div>
      <footer><span>↑↓ Navigate</span><span>↵ Open</span><span>esc Close</span></footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    window.SIGNOFF = { token: "{{TOKEN}}", readOnly: {{READONLY}} };
  </script>
  <script src="/app.js"></script>
</body>
</html>
