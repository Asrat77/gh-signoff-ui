[package]
name = "signoff"
description = "Signoff: see and sign off your pull requests from the tray."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "signoff"

[[bin]]
name = "signoff"
path = "src/main.rs"

[features]
# Start on the demo data by default (the same as passing --demo). Nothing is
# read from or written to GitHub.
demo = []

[dependencies]
signoff-core.workspace = true
signoff-ui.workspace = true
egui.workspace = true
eframe.workspace = true
fastframe-dirs.workspace = true
fastframe-shell.workspace = true
fastframe-tray.workspace = true
jiff.workspace = true
log.workspace = true
env_logger.workspace = true
directories = "6"
# The folder picker for adding a checkout.
rfd = "0.15"

[dev-dependencies]
# Drives the real widgets through their accessibility tree, without a window.
egui_kittest = "0.36"
tempfile.workspace = true

# Installable packages, built with cargo-packager (`cargo packager --release
# -p signoff`). See .github/workflows/package.yml for the formats per OS.
[package.metadata.packager]
product-name = "Signoff"
identifier = "dev.signoff.Signoff"
description = "See and sign off your pull requests from the tray."
category = "DeveloperTool"
homepage = "https://github.com/Asrat77/gh-signoff-ui"
authors = ["Signoff contributors"]
before-packaging-command = "cargo build --release -p signoff"
out-dir = "../../target/packages"
binaries-dir = "../../target/release"
binaries = [{ path = "signoff", main = true }]
icons = ["../../assets/icons/*.png"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
info-plist-path = "packaging/Info.plist"

[package.metadata.packager.deb]
depends = ["libxkbcommon-x11-0"]

[lints]
workspace = true
